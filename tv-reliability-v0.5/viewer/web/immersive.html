<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>I'm-accessibility — live desktop</title>
 <link rel="stylesheet" href="/immersive.css">
</head>
<body>
 <video id="desktop" muted autoplay playsinline preload="auto" aria-label="Live Windows desktop video"></video>
 <button id="surface" type="button" aria-label="Click the full-screen Windows desktop using the LG Magic Remote"></button>
 <div id="controls" aria-label="Desktop control options">
  <button id="control-toggle" type="button" aria-controls="control-panel" aria-expanded="false">Controls ▲</button>
  <div id="control-panel" hidden aria-label="Desktop controls menu">
   <button id="enable" type="button">Enable mouse</button>
   <button id="pause" type="button" disabled>Pause mouse</button>
   <button id="play" type="button">Play video</button>
   <button id="sound" type="button" aria-label="Toggle the television's Windows desktop audio" disabled>TV sound OFF</button>
   <button id="laptop" type="button" aria-label="Switch between television-only and simultaneous television and laptop audio" disabled>Laptop sound ON</button>
   <button id="classic" type="button">Original controls</button>
   <button id="stop" type="button">End TV session</button>
   <div id="status" role="status" aria-live="polite">Connecting to the live desktop…</div>
   <div id="hint">Mouse is OFF. Select Enable mouse to click Windows.</div>
  </div>
 </div>
 <div id="marker" hidden aria-hidden="true">+</div>
 <script src="/immersive.js"></script>
</body>
</html>
